plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

// The core is compiled into this build rather than consumed as a jar: it needs the game classes,
// and only a loader toolchain supplies them. All four loaders map to Mojang's official names, which
// is what lets the shared collection code in common/src/mc/java compile unchanged in each of them.
sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../common/src/main/java', '../common/src/mc/java']
        // The shared resources carry the message catalogues, so a translation is added in one place
        // rather than in four -- the same reasoning as the shared java sources above.
        resources.srcDirs = ['src/main/resources', '../common/src/main/resources']
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

sourceSets {
    main {
        java {
            // Declarations of the mod list's two interfaces, so the entrypoint can implement them without
            // this build depending on that mod at all. Everything here is excluded from the jar below.
            srcDir 'src/apiStub/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Nothing from the mod list is depended on, not even at compile time: the interfaces it expects are
    // declared here as stubs instead. See src/apiStub for why.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

jar {
    from('../LICENSE') {
        rename { "LICENSE-${project.archives_base_name}" }
    }
}

// The stubs are for compiling against only. Excluded here rather than by a separate source set because a
// jar exclusion is one line and directly checkable: the built file is inspected for the package.
tasks.named('jar') {
    exclude 'com/terraformersmc/**'
}
