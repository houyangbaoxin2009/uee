name: Build

on: [push, pull_request]

jobs:
  # The Minecraft-independent core builds anywhere with a JDK, so it runs first and gates the rest:
  # a failure here means the output contract is broken, which no loader build would explain.
  core:
    name: Core (no Minecraft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the core
        run: ./gradlew verifyCore

      - name: Run the smoke test
        run: ./gradlew smokeTest

      - name: Run the configuration test
        run: ./gradlew configTest

      - name: Run the analysis test
        run: ./gradlew analysisTest

      - name: Run the datapack test
        run: ./gradlew datapackTest

  # Each loader builds separately because each needs its own patched game jar. `-x test` keeps the
  # core checks in the job above rather than repeating them four times.
  loaders:
    name: Loaders
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge, quilt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build -x test

  # The in-game tests only exist for NeoForge so far, so they run there and nowhere else. Headless,
  # and non-zero on failure, so this is a real gate rather than a report.
  gametest:
    name: Game tests (NeoForge)
    needs: loaders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run NeoForge game tests
        run: ./gradlew :neoforge:runGameTestServer
