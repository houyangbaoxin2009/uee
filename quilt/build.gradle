plugins {
    // A concrete release, not a snapshot: Quilt's repository does not publish the
    // `1.7-SNAPSHOT` marker that Fabric's does, so the snapshot coordinate simply does not
    // resolve there. 1.7.4 is what Fabric's own Loom resolved to, so the two stay aligned.
    id 'org.quiltmc.loom' version '1.7.4'
}

base {
    archivesName = "${project.archives_base_name}-quilt"
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../core/src/main/java', '../ueea-common/src/main/java', '../common/src/main/java', '../common/src/mc/java']
        // The shared resources carry the message catalogues, so a translation is added in one place
        // rather than in four -- the same reasoning as the shared java sources above.
        resources.srcDirs = ['src/main/resources', '../common/src/main/resources']
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

sourceSets {
    main {
        java {
            // Declarations of the mod list's two interfaces, so the entrypoint can implement them without
            // this build depending on that mod at all. Everything here is excluded from the jar below.
            srcDir 'src/apiStub/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    // Quilt runs Fabric mods through its compatibility layer; the Fabric API is what the shared
    // adapter relies on for the mod list and resource access.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Nothing from the mod list is depended on, not even at compile time: the interfaces it expects are
    // declared here as stubs instead. See src/apiStub for why.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('quilt.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

jar {
    from('../LICENSE') {
        rename { "LICENSE-${project.archives_base_name}" }
    }
}

// The stubs are for compiling against only. Excluded here rather than by a separate source set because a
// jar exclusion is one line and directly checkable: the built file is inspected for the package.
tasks.named('jar') {
    exclude 'com/terraformersmc/**'
}
