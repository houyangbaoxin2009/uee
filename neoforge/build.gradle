plugins {
    // Version taken from the sibling Subterra project's working build.
    id 'net.neoforged.moddev' version '2.0.146'
}

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../common/src/main/java', '../common/src/mc/java']
        // The shared resources carry the message catalogues, so a translation is added in one place
        // rather than in four -- the same reasoning as the shared java sources above.
        resources.srcDirs = ['src/main/resources', '../common/src/main/resources']
    }
}

neoForge {
    version = project.neoforge_version
    // ModDevGradle maps to Mojang's official names, matching the other three loaders so the shared
    // code in common/src/mc/java compiles unchanged here too. Parchment is deliberately not enabled;
    // see the note in gradle.properties.

    runs {
        client {
            client()
            // Namespaces to load game tests from, so /test in a dev client can run UEE's tests.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }

        // Runs every registered game test headlessly and exits with a non-zero status on failure,
        // which is what makes the in-game layer checkable from a build script rather than by hand.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
    }

    mods {
        uee {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

jar {
    from('../LICENSE') {
        rename { "LICENSE-${project.archives_base_name}" }
    }
}
