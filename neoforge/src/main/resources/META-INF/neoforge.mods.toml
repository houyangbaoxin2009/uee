modLoader = "javafml"
loaderVersion = "[1,)"
license = "TPL-2.3"

[[mods]]
modId = "uee"
version = "${version}"
displayName = "Universal Element Exporter"
authors = "houyangbaoxin2009"
description = '''
Multi-loader element exporter for Minecraft.
Exports mod metadata, registries, datapack contents and game assets in one configurable pass,
as machine-readable artifacts for automation such as wiki editing workflows.
'''

# Installable on either side alone. The loader's default is to require the mod on both, which turns
# "client only" and "server only" into a version mismatch at connect time. The value is the loader's own
# constant rather than a guess.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.uee]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.uee]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"
