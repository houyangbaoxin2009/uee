plugins {
    id 'base'
}

allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = project.java_version as Integer
    }
}

/**
 * Compiles the complete core tree including the vendored codec, without {@code -Werror}.
 *
 * <p>Runs first, because {@link #verifyCore} compiles against it. Separate from {@code verifyCore} so
 * that it is still proven the vendored copy builds under this project's target, without its warnings
 * becoming ours to fix — it is an upstream source drop that has to stay byte-identical.
 */
tasks.register('compileVendored', JavaCompile) {
    description = 'Compiles the vendored zd codec to prove it builds under this target.'
    group = 'verification'
    source = fileTree('common/src/main/java') {
        include 'org/tielang/**/*.java'
    }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/compileVendored')
    options.encoding = 'UTF-8'
    options.release = project.java_version as Integer
}

/**
 * Compiles the Minecraft-independent core under {@code -Werror}.
 *
 * <p>common/src/main/java/org/uee holds the model, SPI interfaces, writers, configuration, pipeline
 * and the diagnostic layer — none of which mentions a game type. Building it with no loader toolchain
 * and no game jar is the property that makes the output contract verifiable in isolation.
 */
tasks.register('verifyCore', JavaCompile) {
    description = 'Compiles the Minecraft-independent core (model, SPI, writers, pipeline, analysis).'
    group = 'verification'
    dependsOn 'compileVendored'
    source = fileTree('common/src/main/java') {
        include 'org/uee/**/*.java'
    }
    classpath = files(layout.buildDirectory.dir('classes/compileVendored'))
    destinationDirectory = layout.buildDirectory.dir('classes/verifyCore')
    options.encoding = 'UTF-8'
    options.release = project.java_version as Integer
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

/** Compiles the smoke, round-trip and analysis harnesses against the core output. */
tasks.register('verifyHarness', JavaCompile) {
    description = 'Compiles the smoke test, the zd round-trip check and the analysis test.'
    group = 'verification'
    dependsOn 'verifyCore', 'compileVendored'
    source = fileTree('common/src/test/java') { include '**/*.java' }
    classpath = files(layout.buildDirectory.dir('classes/verifyCore'),
            layout.buildDirectory.dir('classes/compileVendored'))
    destinationDirectory = layout.buildDirectory.dir('classes/verifyHarness')
    options.encoding = 'UTF-8'
    options.release = project.java_version as Integer
}

/** Classpath shared by the harness runners. */
def harnessClasspath = files(layout.buildDirectory.dir('classes/verifyCore'),
        layout.buildDirectory.dir('classes/compileVendored'),
        layout.buildDirectory.dir('classes/verifyHarness'))

tasks.register('smokeTest', JavaExec) {
    description = 'Runs the end-to-end pipeline over a synthetic adapter.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.SmokeTest'
    args = [layout.buildDirectory.dir('smoke').get().asFile.absolutePath]
}

/**
 * Runs the configuration checks.
 *
 * <p>Covers the td syntax, the comments in a written config, the layering of defaults over file over
 * command line, and the shared token vocabulary. Configuration is decided before anything touches
 * Minecraft, so this needs no game either.
 */
tasks.register('configTest', JavaExec) {
    description = 'Runs the config-file, layering and vocabulary checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.ConfigTest'
    args = [layout.buildDirectory.dir('config-test').get().asFile.absolutePath]
}

/**
 * Runs the analysis checks over generated jar fixtures.
 *
 * <p>Separate from the smoke test because it covers a different claim: the smoke test proves the
 * pipeline and every writer work, while this proves container scanning, mixin parsing, the stage
 * split and the dependency/namespace/coverage checks work.
 */
tasks.register('analysisTest', JavaExec) {
    description = 'Runs the container-scan, mixin-parse and analysis checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.AnalysisTest'
    args = [layout.buildDirectory.dir('analysis-test').get().asFile.absolutePath]
}

/**
 * Runs the datapack and global-pack checks.
 *
 * <p>Covers the fourth interface — flows, collection targets and analysis strategies declared in data
 * files — plus the global-datapack policy. Both are file-system and data only, so neither needs a
 * game; the fixtures are real datapack directory trees because the layout is part of what is tested.
 */
tasks.register('datapackTest', JavaExec) {
    description = 'Runs the datapack-definition and global-datapack checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.DatapackTest'
    args = [layout.buildDirectory.dir('datapack-test').get().asFile.absolutePath]
}

/**
 * Runs the MC-function interface checks: the job model and the off-thread safety gate.
 *
 * <p>Both are only testable here. Inside a game, a blocking export is the failure that takes the
 * server down, so it cannot be provoked on purpose — but nothing about the job model or the gate
 * depends on Minecraft, so a stub adapter is enough.
 */
tasks.register('functionTest', JavaExec) {
    description = 'Runs the job-model and off-thread safety-gate checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.FunctionInterfaceTest'
    args = [layout.buildDirectory.dir('function-test').get().asFile.absolutePath]
}

/**
 * Runs the default-and-knobs checks.
 *
 * <p>Two claims, both asserted rather than assumed: that the one-key default is the right answer most
 * of the time — complete for its purpose, and not straddling the collection/analysis boundary — and
 * that every long-form setting actually reaches the output. A setting that is parsed but not applied
 * is worse than one that is absent, so each knob is verified by running an export and looking at the
 * result rather than by inspecting the configuration object.
 */
tasks.register('defaultsTest', JavaExec) {
    description = 'Runs the one-key-default and long-form-setting checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.DefaultsAndKnobsTest'
    args = [layout.buildDirectory.dir('defaults-test').get().asFile.absolutePath]
}

/**
 * Runs the command-surface checks.
 *
 * <p>The command vocabulary used to be the one part of the system with no coverage at all, because
 * the parsing lived in the class that also sends replies and that class cannot load without
 * Brigadier. The logic now sits in a class with no Minecraft dependency, so every token, every
 * refusal and every session override is verifiable without a game.
 */
tasks.register('commandSurfaceTest', JavaExec) {
    description = 'Runs the command-vocabulary and session-layer checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.CommandSurfaceTest'
    args = [layout.buildDirectory.dir('command-surface-test').get().asFile.absolutePath]
}

/**
 * Checks that the export's memory does not grow with the pack.
 *
 * <p>This is the one claim the pipeline is built on, and it had never been measured. The check runs
 * its largest case again inside child JVMs with a small fixed heap, so it is satisfied only by writing
 * far more output than the heap could hold -- which no buffering design can fake.
 */
tasks.register('scaleTest', JavaExec) {
    description = 'Checks that export memory is independent of pack size.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.ScaleTest'
    // A generous heap so the measurement itself is never the thing under pressure: what is being
    // measured is the pipeline's live set, not this JVM's ability to allocate.
    maxHeapSize = '2g'
    args = [layout.buildDirectory.dir('scale-test').get().asFile.absolutePath]
}

/**
 * Runs the tag-collection checks.
 *
 * <p>Tags are the first datapack-backed category, and the risky part is the shape handling rather than
 * the collection: three entry forms, a replace flag, and a merge across packs whose direction is
 * counter-intuitive. None of that needs a game, which is why the parsing lives in the core.
 */
tasks.register('tagTest', JavaExec) {
    description = 'Runs the tag parsing, merge and record checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.TagTest'
    args = [layout.buildDirectory.dir('tag-test').get().asFile.absolutePath]
}

/**
 * Runs the loot-table checks, and the parallel skeleton's own properties.
 *
 * <p>Two things are checked here that a category test alone would miss: that the parser handles every
 * entry shape the shipped data actually contains, and that running the collection across threads produces
 * byte-identical output to running it on one. The second is the whole reason the parallelism is safe to
 * enable.
 */
tasks.register('lootTableTest', JavaExec) {
    description = 'Runs the loot-table parser and parallel-ordering checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.LootTableTest'
    args = [layout.buildDirectory.dir('loot-table-test').get().asFile.absolutePath]
}

/**
 * Runs the icon phase's checks: the store, the batching, and the PNG encoder.
 *
 * <p>The encoder is checked by handing its output to the JDK's own image reader, so "it is a PNG" is
 * established by something other than the code that wrote it. The rendering is not checked anywhere --
 * there is no client in the test environment -- and the phase is deliberately shaped so that everything
 * except the render call can be.
 */
tasks.register('iconTest', JavaExec) {
    description = 'Runs the icon store, phase and png encoder checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.IconTest'
    args = [layout.buildDirectory.dir('icon-test').get().asFile.absolutePath]
}

/**
 * Runs the category-coverage checks.
 *
 * <p>This is the cheapest test in the project and it covers the most damaging class of defect found so
 * far: nine categories were selectable and collected by nothing, so a user got less than they asked for
 * and no way to tell. The check is that every declared category is accounted for by the registry table or
 * by a named dedicated collector.
 */
tasks.register('categoryTest', JavaExec) {
    description = 'Checks that every declared category has a collector.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.CategoryTest'
}

/**
 * Runs the advancement checks.
 *
 * <p>Nine records in ten have no display block, which is the fact the parser is shaped around and the
 * fact a plausible implementation gets wrong in one of two directions: dropping them, or reporting them
 * as damaged.
 */
tasks.register('advancementTest', JavaExec) {
    description = 'Runs the advancement parser checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.AdvancementTest'
}

/**
 * Runs the world-generation checks.
 *
 * <p>Unusual among these in that it parses the shipped data when a Minecraft jar is on the machine --
 * a thousand files across fourteen kinds with almost nothing in common, two of whose facts are
 * counter-intuitive. A sample can encode a belief about those; a thousand real files cannot. The jar is
 * looked for rather than required, and the survey reports itself as skipped when there is none.
 */
tasks.register('worldgenTest', JavaExec) {
    description = 'Runs the world-generation parser checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.WorldgenTest'
}

/**
 * Runs the function checks.
 *
 * <p>A function is a text file, so this is the category where the rules are least guessable: a trailing
 * backslash continues a line, a leading hash is a comment, a leading dollar sign is a macro and a leading
 * slash is a mistake the game refuses. Each is read off the game's own reader, and the parser is then run
 * over every function in a real datapack when one is on the machine.
 */
tasks.register('mcfunctionTest', JavaExec) {
    description = 'Runs the function-file parser checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.FunctionTest'
}

/**
 * Runs the delta checks: fingerprints, the snapshot manifest, and the decisions taken against it.
 *
 * <p>The fingerprints are checked against the published SHA-256 vectors rather than against each other,
 * for the same reason the png encoder is checked with a decoder: two runs of the same code agree with
 * themselves even when the algorithm is wrong, and a fingerprint that is wrong is a change that goes
 * unreported.
 */
tasks.register('deltaTest', JavaExec) {
    description = 'Runs the delta, fingerprint and snapshot checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.DeltaTest'
    args = [layout.buildDirectory.dir('delta-test').get().asFile.absolutePath]
}

/**
 * Runs the asset path and copy checks.
 *
 * <p>The path rules are pure; the copying is exercised against real files, including the case the feature
 * exists for -- a second pass over the same bytes writes nothing. The enumeration needs a resource manager
 * and is covered by a game test instead.
 */
tasks.register('assetTest', JavaExec) {
    description = 'Runs the asset path and copy checks.'
    group = 'verification'
    dependsOn 'verifyHarness'
    classpath = harnessClasspath
    mainClass = 'org.uee.AssetTest'
    args = [layout.buildDirectory.dir('asset-test').get().asFile.absolutePath]
}

/** Runs every Minecraft-independent check. */
tasks.register('verifyAll') {
    description = 'Runs every Minecraft-independent check.'
    group = 'verification'
    dependsOn 'verifyCore', 'compileVendored', 'smokeTest', 'configTest', 'analysisTest',
            'datapackTest', 'functionTest', 'defaultsTest', 'commandSurfaceTest', 'scaleTest',
            'tagTest', 'lootTableTest', 'iconTest', 'categoryTest', 'advancementTest',
            'worldgenTest', 'mcfunctionTest', 'deltaTest', 'assetTest'
}
