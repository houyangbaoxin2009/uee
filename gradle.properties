# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_version=0.1.0
maven_group=org.uee
archives_base_name=uee

# Target line. The first release targets the 1.21.x line. These values select what gets compiled
# against — they are never read at runtime. UEE deliberately makes no runtime decision by comparing
# version numbers, because Minecraft's own versioning scheme already changed once.
#
# NOTE: loader/toolchain versions move. On a fresh clone, cross-check these against each loader's
# current documentation before the first build; only the game version is a deliberate pin.
minecraft_version=1.21.1
java_version=21

# Fabric / Quilt
fabric_loader_version=0.16.5
fabric_api_version=0.102.1+1.21.1
quilt_loader_version=0.26.3-beta.1

# NeoForge
neoforge_version=21.1.72
neoform_version=1.21.1-20240808.144430

# Forge
forge_version=52.0.28
