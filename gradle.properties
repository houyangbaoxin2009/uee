# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_version=0.1.0
maven_group=org.uee
archives_base_name=uee

# Target line. The first release targets the 1.21.x line. These values select what gets compiled
# against — they are never read at runtime. UEE deliberately makes no runtime decision by comparing
# version numbers, because Minecraft's own versioning scheme already changed once.
#
# The NeoForge and ModDevGradle values below are taken from the sibling Subterra project, which builds
# against 1.21.1 today, so they are known-good rather than guessed. The Fabric, Quilt and Forge values
# have not been verified on this machine — cross-check them against each loader's current
# documentation before the first build.
minecraft_version=1.21.1
java_version=21

# Fabric
fabric_loader_version=0.16.5
fabric_api_version=0.102.1+1.21.1

# Quilt
quilt_loader_version=0.26.3-beta.1

# NeoForge — verified against Subterra's working build.
neoforge_version=21.1.249

# Forge
forge_version=52.0.28

# Intentionally NOT using Parchment, even though the sibling project does. Parchment supplies
# parameter names on top of Mojang's official names, and configuring it for one loader but not the
# other three would make the shared code in common/src/mc/java see different signatures depending on
# which loader compiled it. Uniform official mappings across all four loaders is the property that
# keeps that shared layer valid.
